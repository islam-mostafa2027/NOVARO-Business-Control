name: Build NOVARO Inventory Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare the shared NOVARO web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg www/

      - name: Generate Android project
        run: npx cap add android

      - name: Enable Android Autofill save support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if path is None:
              raise SystemExit("MainActivity.java not found")
          source = path.read_text()
          imports = [
              "import android.content.Context;",
              "import android.os.Build;",
              "import android.view.View;",
              "import android.view.autofill.AutofillManager;",
              "import android.webkit.JavascriptInterface;",
          ]
          lines = source.splitlines()
          package_index = next(i for i, line in enumerate(lines) if line.startswith("package "))
          existing_imports = set(line.strip() for line in lines if line.startswith("import "))
          lines[package_index + 1:package_index + 1] = [line for line in imports if line not in existing_imports] + [""]
          source = "\n".join(lines) + "\n"
          if "class NovaroAutofillBridge" not in source:
              bridge = """
          private class NovaroAutofillBridge {
              @JavascriptInterface
              public void commit() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      runOnUiThread(() -> {
                          AutofillManager manager = (AutofillManager) getSystemService(Context.AUTOFILL_SERVICE);
                          if (manager != null) manager.commit();
                      });
                  }
              }
              @JavascriptInterface
              public void cancel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      runOnUiThread(() -> {
                          AutofillManager manager = (AutofillManager) getSystemService(Context.AUTOFILL_SERVICE);
                          if (manager != null) manager.cancel();
                      });
                  }
              }
          }
          """
              source = source.replace("public class MainActivity extends BridgeActivity {",
                                      "public class MainActivity extends BridgeActivity {\n" + bridge, 1)
          needle = "super.onCreate(savedInstanceState);"
          setup = '''
                  if (Build.VERSION.SDK_INT >= 26 && getBridge() != null && getBridge().getWebView() != null) {
                      android.webkit.WebView webView = getBridge().getWebView();
                      webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
                      webView.setSaveEnabled(true);
                      webView.addJavascriptInterface(new NovaroAutofillBridge(), "NOVAROAndroidAutofill");
                  }'''
          if "NOVAROAndroidAutofill" not in source:
              if needle not in source:
                  raise SystemExit("Could not find MainActivity onCreate hook")
              source = source.replace(needle, needle + setup, 1)
          path.write_text(source)
          print("Android Autofill save bridge configured:", path)
          PY
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../NOVARO-Inventory.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVARO-Inventory-Android-APK
          path: NOVARO-Inventory.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novaro-apk-build-${{ github.run_number }}
          name: NOVARO Inventory Android - Build ${{ github.run_number }}
          make_latest: true
          files: NOVARO-Inventory.apk
          body: |
            NOVARO Inventory Android APK.
            This app connects to the same Supabase project as the NOVARO Inventory web version.
            Install on Android. Internet access is required for live data and account sign-in.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

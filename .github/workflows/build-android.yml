name: Build NOVARO Inventory Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare the shared NOVARO web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg www/

      - name: Generate Android project
        run: npx cap add android

      - name: Enable Android Autofill save support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if path is None:
              raise SystemExit("MainActivity.java not found")
          source = path.read_text()
          if "NOVAROAndroidAutofill" not in source:
              imports = [
                  "import android.content.Context;",
                  "import android.os.Build;",
                  "import android.view.View;",
                  "import android.view.autofill.AutofillManager;",
                  "import android.webkit.JavascriptInterface;",
                  "import com.getcapacitor.BridgeActivity;",
              ]
              lines = source.splitlines()
              package_index = next(i for i, line in enumerate(lines) if line.startswith("package "))
              existing = set(line.strip() for line in lines if line.startswith("import "))
              lines[package_index + 1:package_index + 1] = [x for x in imports if x not in existing] + [""]
              source = "\n".join(lines) + "\n"
              class_match = re.search(r"public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{", source)
              if not class_match:
                  raise SystemExit("MainActivity class declaration not recognized")
              addition = """
              private class NovaroAutofillBridge {
                  @JavascriptInterface public void commit() {
                      if (Build.VERSION.SDK_INT >= 26) runOnUiThread(() -> {
                          AutofillManager manager = getSystemService(AutofillManager.class);
                          if (manager != null) manager.commit();
                      });
                  }
                  @JavascriptInterface public void cancel() {
                      if (Build.VERSION.SDK_INT >= 26) runOnUiThread(() -> {
                          AutofillManager manager = getSystemService(AutofillManager.class);
                          if (manager != null) manager.cancel();
                      });
                  }
              }

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 26) {
                      android.webkit.WebView webView = getBridge().getWebView();
                      webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
                      webView.setSaveEnabled(true);
                      webView.addJavascriptInterface(new NovaroAutofillBridge(), "NOVAROAndroidAutofill");
                  }
              }
              """
              insert_at = class_match.end()
              source = source[:insert_at] + addition + source[insert_at:]
              path.write_text(source)
          print("Android WebView Autofill bridge enabled:", path)
          PY
      - name: Add Google Password Manager Credential Manager support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              raise SystemExit("Expected generated Groovy Gradle file")
          g = gradle.read_text()
          deps = [
              'implementation "androidx.credentials:credentials:1.6.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.6.0"'
          ]
          for dep in deps:
              artifact = dep.split('"')[1].split(':')[1]
              if artifact not in g:
                  if "dependencies {" not in g:
                      raise SystemExit("Gradle dependencies block not found")
                  g = g.replace("dependencies {", "dependencies {\n    " + dep, 1)
          gradle.write_text(g)
          main = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if main is None:
              raise SystemExit("MainActivity.java not found")
          s = main.read_text()
          imports = [
              "import androidx.credentials.CredentialManager;",
              "import androidx.credentials.CreatePasswordRequest;",
              "import androidx.credentials.CreateCredentialResponse;",
              "import androidx.credentials.GetCredentialRequest;",
              "import androidx.credentials.GetCredentialResponse;",
              "import androidx.credentials.GetPasswordOption;",
              "import androidx.credentials.PasswordCredential;",
              "import androidx.credentials.exceptions.CreateCredentialException;",
              "import androidx.credentials.exceptions.GetCredentialException;",
              "import androidx.credentials.CredentialManagerCallback;",
              "import java.util.concurrent.Executors;"
          ]
          lines = s.splitlines()
          existing = set(x.strip() for x in lines if x.startswith("import "))
          idx = max(i for i,x in enumerate(lines) if x.startswith("import "))
          lines[idx+1:idx+1] = [x for x in imports if x not in existing]
          s = "\n".join(lines) + "\n"
          pattern = r'@JavascriptInterface public void commit\(\) \{.*?\n\s*\}(?=\s*@JavascriptInterface public void cancel\(\))'
          new_methods = """@JavascriptInterface public void save(String username, String password) {
                  runOnUiThread(() -> {
                      try {
                          CredentialManager manager = CredentialManager.create(MainActivity.this);
                          CreatePasswordRequest request = new CreatePasswordRequest(username, password);
                          manager.createCredentialAsync(MainActivity.this, request, null,
                              Executors.newSingleThreadExecutor(),
                              new CredentialManagerCallback<CreateCredentialResponse, CreateCredentialException>() {
                                  @Override public void onResult(CreateCredentialResponse result) {
                                      android.util.Log.i("NOVARO", "Credential save flow completed");
                                  }
                                  @Override public void onError(CreateCredentialException e) {
                                      android.util.Log.w("NOVARO", "Password save was not completed", e);
                                  }
                              });
                      } catch (Exception e) {
                          android.util.Log.w("NOVARO", "Credential Manager unavailable", e);
                      }
                  });
              }
              @JavascriptInterface public void get() {
                  runOnUiThread(() -> {
                      try {
                          CredentialManager manager = CredentialManager.create(MainActivity.this);
                          GetCredentialRequest request = new GetCredentialRequest.Builder()
                              .addCredentialOption(new GetPasswordOption())
                              .build();
                          manager.getCredentialAsync(MainActivity.this, request, null,
                              Executors.newSingleThreadExecutor(),
                              new CredentialManagerCallback<GetCredentialResponse, GetCredentialException>() {
                                  @Override public void onResult(GetCredentialResponse result) {
                                      if (result.getCredential() instanceof PasswordCredential) {
                                          PasswordCredential credential = (PasswordCredential) result.getCredential();
                                          String js = "window.NOVAROFillCredentials && window.NOVAROFillCredentials("
                                              + org.json.JSONObject.quote(credential.getId()) + ","
                                              + org.json.JSONObject.quote(credential.getPassword()) + ");";
                                          getBridge().getWebView().post(() ->
                                              getBridge().getWebView().evaluateJavascript(js, null));
                                      }
                                  }
                                  @Override public void onError(GetCredentialException e) {
                                      android.util.Log.i("NOVARO", "No saved credential selected or retrieval cancelled", e);
                                  }
                              });
                      } catch (Exception e) {
                          android.util.Log.w("NOVARO", "Credential retrieval unavailable", e);
                      }
                  });
              }"""
          s, count = re.subn(pattern, lambda _: new_methods, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely replace Android Autofill commit method")
          main.write_text(s)
          print("Credential Manager save and retrieval bridge configured")
          PY
      - name: Generate matching NOVARO Android launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import xml.etree.ElementTree as ET

          root = Path("android/app/src/main/res")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"

          def gradient(size):
              w = h = size
              im = Image.new("RGB", (w,h))
              px = im.load()
              a=(45,128,107); b=(24,90,73)
              for y in range(h):
                  for x in range(w):
                      t=(x+y)/(w+h-2)
                      px[x,y]=tuple(round(a[k]*(1-t)+b[k]*t) for k in range(3))
              return im

          def draw_logo(size, tile=True):
              scale=size/512
              if tile:
                  im=gradient(size).convert("RGBA")
                  mask=Image.new("L",(size,size),0)
                  md=ImageDraw.Draw(mask)
                  md.rounded_rectangle((20*scale,20*scale,492*scale,492*scale),radius=118*scale,fill=255)
                  im.putalpha(mask)
              else:
                  im=Image.new("RGBA",(size,size),(0,0,0,0))
              d=ImageDraw.Draw(im)
              font=ImageFont.truetype(font_path,int(225*scale))
              # Bold N centered, matching the NOVARO header mark.
              box=d.textbbox((0,0),"N",font=font,stroke_width=0)
              x=(size-(box[2]-box[0]))/2-box[0]-10*scale
              y=(size-(box[3]-box[1]))/2-box[1]-4*scale
              d.text((x,y),"N",font=font,fill="#ffffff")
              d.line((352*scale,393*scale,410*scale,335*scale),fill="#a9e0dc",width=max(3,int(24*scale)))
              return im

          for density, size in sizes.items():
              folder=root/f"mipmap-{density}"
              folder.mkdir(parents=True,exist_ok=True)
              icon=draw_logo(size,True)
              icon.save(folder/"ic_launcher.png")
              icon.save(folder/"ic_launcher_round.png")

          drawable=root/"drawable"
          drawable.mkdir(parents=True,exist_ok=True)
          draw_logo(432,False).save(root/"drawable-nodpi"/"ic_launcher_foreground.png") if (root/"drawable-nodpi").mkdir(parents=True,exist_ok=True) is None else None
          (drawable/"ic_launcher_background.xml").write_text("""<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><gradient android:startColor="#2d806b" android:endColor="#185a49" android:angle="135"/></shape>""")
          adaptive=root/"mipmap-anydpi-v26"
          adaptive.mkdir(parents=True,exist_ok=True)
          (adaptive/"ic_launcher.xml").write_text("""<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>""")
          (adaptive/"ic_launcher_round.xml").write_text("""<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>""")
          print("NOVARO launcher icons generated in all Android densities")
          PY
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../NOVARO-Inventory.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVARO-Inventory-Android-APK
          path: NOVARO-Inventory.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novaro-apk-build-${{ github.run_number }}
          name: NOVARO Inventory Android - Build ${{ github.run_number }}
          make_latest: true
          files: NOVARO-Inventory.apk
          body: |
            NOVARO Inventory Android APK.
            This app connects to the same Supabase project as the NOVARO Inventory web version.
            Install on Android. Internet access is required for live data and account sign-in.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

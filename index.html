/* NOVARO refined interface */
:root{--g:#287d6b;--bg:#f4f8f6;--ink:#243b34;--muted:#71827c;--line:#e1ebe6}
body{font-family:Inter,system-ui,"Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.01em}
.wrap{max-width:1180px;padding:20px}
header.row{position:sticky;top:0;z-index:20;background:rgba(244,248,246,.94);backdrop-filter:blur(12px);padding:12px 14px;border:1px solid #e4eee9;border-radius:16px;margin:0 0 14px;box-shadow:0 8px 28px #173d300a}
.logo{min-width:44px;min-height:44px;display:grid;place-items:center;box-shadow:0 5px 14px #287d6b25}
.card{border-radius:18px;padding:20px;box-shadow:0 8px 28px #173d300c;transition:box-shadow .22s ease,transform .22s ease}
.card:hover{box-shadow:0 12px 32px #173d3014}
button{border-radius:11px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease;box-shadow:0 2px 6px #173d3010}
button:hover{transform:translateY(-1px);box-shadow:0 6px 14px #173d3020}
button:active{transform:translateY(0) scale(.98)}
.tabs{gap:9px;padding:10px 2px 14px;scrollbar-width:thin}
.tabs button{border:1px solid transparent;padding:11px 18px}
.tabs button.active{box-shadow:0 5px 13px #287d6b2b}
.field input,.field select,input,select{transition:border-color .18s ease,box-shadow .18s ease}
.field input:focus,.field select:focus,input:focus,select:focus{outline:none;border-color:#72b4a1;box-shadow:0 0 0 3px #287d6b18}
table{border-spacing:0}
th{background:#f7faf8;font-weight:700}
td,th{padding:13px 12px}
tbody tr{transition:background .16s ease}
tbody tr:hover{background:#f7fbf9}
#main.page-enter{animation:novaroPageIn .28s cubic-bezier(.2,.75,.25,1) both}
@keyframes novaroPageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:600px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}header.row{position:relative;padding:10px}.card{padding:15px;border-radius:15px}.tabs button{padding:10px 14px}}
body[dir="ltr"]{direction:ltr}body[dir="ltr"] td,body[dir="ltr"] th{text-align:left}body[dir="ltr"] .field label{text-align:left}
/* NOVARO navigation and language control refresh */
.app-header{position:sticky;top:10px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;margin:0 0 18px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 26px #173d300c;backdrop-filter:blur(14px)}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.language-control{background:#edf5f1;color:var(--g);border:1px solid #dcebe4;box-shadow:none;padding:9px 13px;border-radius:999px;font-size:13px}
.logout-control{border-radius:999px;padding:9px 14px}
#who{font-size:13px;padding-inline:8px}
.tabs{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;padding:7px;margin:0 0 18px;background:#eaf1ed;border:1px solid #e1ebe6;border-radius:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;background:transparent;color:#65766f;border:0;border-radius:11px;padding:12px 18px;box-shadow:none;font-weight:650}
.tabs button:hover{background:#f7faf8;transform:none;box-shadow:none}
.tabs button.active{background:#fff;color:var(--g);box-shadow:0 3px 12px #173d3012}
#main{min-height:55vh}
@media(max-width:600px){
 .wrap{padding:10px 10px 88px}
 .app-header{position:relative;top:auto;padding:11px 12px;border-radius:16px;margin-bottom:12px;align-items:center}
 .app-header .brand{gap:8px}.app-header .logo{min-width:38px;min-height:38px;padding:8px}

const reverseTranslations=Object.fromEntries(Object.entries(translations).map(([a,b])=>[b,a]));
let language=localStorage.getItem("novaro-language")||"ar";
function applyLanguage(){
 const dict=language==="en"?translations:reverseTranslations;
 document.documentElement.lang=language;document.documentElement.dir=language==="ar"?"rtl":"ltr";
 document.body.dir=document.documentElement.dir;
 const pairs=Object.entries(dict).sort((a,b)=>b[0].length-a[0].length);
 const translateText=v=>{let out=v;for(const [from,to] of pairs){if(from)out=out.split(from).join(to)}return out};
 const walk=n=>{if(n.nodeType===Node.TEXT_NODE){n.nodeValue=translateText(n.nodeValue)}
 else if(n.nodeType===Node.ELEMENT_NODE){if(n.tagName==="SCRIPT"||n.tagName==="STYLE"||n.tagName==="NOSCRIPT")return;if(n.placeholder)n.placeholder=translateText(n.placeholder);if(n.title)n.title=translateText(n.title);if(n.value&&n.tagName==="BUTTON")n.value=translateText(n.value);for(const c of [...n.childNodes])walk(c)}};
 const obs=window.__novaroObserver;if(obs)obs.disconnect();walk(document.body);
 const a=document.getElementById("langToggle"),b=document.getElementById("langToggleApp");
 if(a)a.textContent=language==="ar"?"English":"العربية";
 if(b)b.textContent=language==="ar"?"English":"العربية";
 if(obs){obs.takeRecords();obs.observe(document.body,{childList:true,subtree:true,characterData:true});}
}
function setLanguage(next){language=next;localStorage.setItem("novaro-language",language);applyLanguage();if(user&&profile)render();}
document.addEventListener("click",e=>{if(e.target.id==="langToggle"||e.target.id==="langToggleApp")setLanguage(language==="ar"?"en":"ar")});
let languageUpdatePending=false;
const languageObserver=new MutationObserver(()=>{if(languageUpdatePending)return;languageUpdatePending=true;queueMicrotask(()=>{languageUpdatePending=false;applyLanguage();});});
window.__novaroObserver=languageObserver;
languageObserver.observe(document.body,{childList:true,subtree:true,characterData:true});

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#287d6b"><link rel="manifest" href="manifest.webmanifest"><title>NOVARO Inventory</title><style>
:root{--g:#287d6b;--bg:#f3f7f5;--ink:#263a35;--muted:#71817c;--line:#e2ebe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--g);color:white;font-weight:650}.soft{background:#e6f1ed;color:var(--g)}.wrap{max-width:1050px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 5px 20px #173d3010}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--g);color:white;border-radius:13px;padding:12px;font-weight:800}.muted{color:var(--muted)}.hidden{display:none!important}.login{max-width:420px;margin:9vh auto}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap;background:#e8efec;color:#50615b}.tabs button.active{background:var(--g);color:white}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat b{display:block;font-size:26px;margin-top:5px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}td,th{text-align:right;padding:11px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted)}.error{color:#b43f3f;white-space:pre-wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:600px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="wrap"><div class="card login"><div class="brand"><div class="logo">N</div><div><b>NOVARO Inventory</b><div class="muted">إدارة مخزون أدوات الصالة والخدمة</div></div></div><h2>تسجيل الدخول</h2><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button id="loginBtn">دخول</button></form><div id="loginErr" class="error"></div><p class="muted">إذا لم يكن لديك حساب، أنشئ حسابًا من لوحة Supabase ثم سجّل الدخول.</p></div></div>
<div id="app" class="hidden"><div class="wrap"><header class="row"><div class="brand"><div class="logo">N</div><div><b>NOVARO Inventory</b><div class="muted">Front of House Inventory</div></div></div><div><span id="who" class="muted"></span> <button class="soft" id="logout">خروج</button></div></header><nav class="tabs" id="tabs"><button data-p="home" class="active">الرئيسية</button><button data-p="items">الأصناف</button><button data-p="moves">حركة المخزون</button><button data-p="counts">الجرد الفعلي</button><button data-p="branches">الفروع</button></nav><main id="main"></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://acgbcucjdmkboryxbhid.supabase.co","sb_publishable_vQDlXiK2w8tbqA7iVgXfDw__zDbw2mz");
let user,profile,branches=[],items=[],cats=[],branchId,page="home";
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function err(e){console.error(e);alert(e.message||"حدث خطأ")}
async function init(){const {data:{session}}=await db.auth.getSession();if(session)await enter(session.user);db.auth.onAuthStateChange((ev,s)=>{if(s)enter(s.user);else{$("app").classList.add("hidden");$("login").classList.remove("hidden")}})}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginBtn").disabled=false;if(error){$("loginErr").textContent=error.message;return}await enter(data.user)};
$("logout").onclick=()=>db.auth.signOut();
async function enter(u){user=u;let r=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();if(r.error)throw r.error;if(!r.data){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("main").innerHTML='<section class="card"><h2>إعداد المالك لأول مرة</h2><p class="muted">أدخل اسمك واسم أول فرع. هذا الإجراء متاح للبريد المعتمد فقط.</p><div class="field"><label>اسم المالك</label><input id="ownerName"></div><div class="formgrid"><div class="field"><label>اسم الفرع بالعربية</label><input id="branchAr"></div><div class="field"><label>اسم الفرع بالإنجليزية</label><input id="branchEn"></div></div><button id="initOwner">تهيئة النظام</button><div id="initErr" class="error"></div></section>';$("initOwner").onclick=async()=>{let {error}=await db.rpc("initialize_inventory_owner",{p_display_name:$("ownerName").value,p_branch_name_ar:$("branchAr").value,p_branch_name_en:$("branchEn").value});if(error){$("initErr").textContent=error.message;return}await enter(u)};return}
profile=r.data;if(!profile.is_active){await db.auth.signOut();throw Error("الحساب موقوف")} $("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=esc(profile.display_name||u.email);await load();render()}
async function load(){let q=db.from("branches").select("*").eq("is_active",true).order("name_ar");if(profile.role!=="owner_admin"){let m=await db.from("branch_members").select("branch_id").eq("user_id",user.id).eq("is_active",true);q=q.in("id",(m.data||[]).map(x=>x.branch_id))}let [b,i,c]=await Promise.all([q,db.from("items").select("*,categories(name_ar)").eq("is_active",true).order("name_ar"),db.from("categories").select("*").eq("is_active",true).order("sort_order")]);if(b.error)throw b.error;if(i.error)throw i.error;if(c.error)throw c.error;branches=b.data||[];items=i.data||[];cats=c.data||[];if(!branches.some(x=>x.id===branchId))branchId=branches[0]?.id}
$("tabs").onclick=e=>{let b=e.target.closest("[data-p]");if(b){page=b.dataset.p;render()}};
const sel=()=>'<select id="branchSelect">'+branches.map(b=>'<option value="'+b.id+'">'+esc(b.name_ar)+'</option>').join("")+'</select>';
function render(){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===page));let m=$("main");if(!branches.length){m.innerHTML='<section class="card empty">لا توجد فروع مرتبطة بحسابك. تواصل مع مالك النظام.</section>';return}
if(page==="home")m.innerHTML='<section class="stats"><div class="card">إجمالي الأصناف<b>'+items.length+'</b></div><div class="card">الفروع المتاحة<b>'+branches.length+'</b></div><div class="card">المستخدم الحالي<b style="font-size:16px">'+esc(profile.role)+'</b></div></section><section class="card"><div class="row"><h3>حركات الفرع الأخيرة</h3>'+sel()+'</div><div id="latest" class="empty">تحميل...</div></section>';
if(page==="items")m.innerHTML='<section class="card"><div class="row"><h3>الأصناف</h3><button onclick="addItem()">＋ صنف جديد</button></div><input id="search" placeholder="بحث باسم الصنف أو الكود" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:9px"><div class="tablewrap"><table><thead><tr><th>الكود</th><th>الصنف</th><th>التصنيف</th><th>الوحدة</th></tr></thead><tbody id="itemRows">'+itemRows(items)+'</tbody></table></div></section>';
if(page==="moves")m.innerHTML='<section class="card"><div class="row"><h3>حركة المخزون</h3><button onclick="addMove()">＋ تسجيل حركة</button></div><div id="moveRows" class="empty">تحميل...</div></section>';
if(page==="counts")m.innerHTML='<section class="card"><div class="row"><h3>الجرد الفعلي</h3><button onclick="addSession()">＋ جلسة جرد</button></div><div id="sessions" class="empty">تحميل...</div></section>';
if(page==="branches")m.innerHTML='<section class="card"><div class="row"><h3>الفروع</h3></div><div class="tablewrap"><table><tr><th>الكود</th><th>اسم الفرع</th></tr>'+branches.map(b=>'<tr><td>'+esc(b.code)+'</td><td>'+esc(b.name_ar)+'</td></tr>').join("")+'</table></div></section>';
if($("branchSelect")){$("branchSelect").value=branchId;$("branchSelect").onchange=e=>{branchId=e.target.value;render()}}
if(page==="home")latest();if(page==="moves")moves();if(page==="counts")sessions();if(page==="items")$("search").oninput=e=>$("itemRows").innerHTML=itemRows(items.filter(i=>(i.name_ar+" "+i.item_code).toLowerCase().includes(e.target.value.toLowerCase())))}
function itemRows(a){return a.length?a.map(i=>'<tr><td>'+esc(i.item_code||"—")+'</td><td>'+esc(i.name_ar)+'</td><td>'+esc(i.categories?.name_ar||"—")+'</td><td>'+esc(i.unit_ar||"قطعة")+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">لا توجد أصناف</td></tr>'}
async function latest(){let r=await db.from("stock_movements").select("*,items(name_ar)").eq("branch_id",branchId).order("created_at",{ascending:false}).limit(8);$("latest").innerHTML=r.error?esc(r.error.message):r.data.length?tableMoves(r.data):"لا توجد حركات مسجلة"}
function tableMoves(a){return '<div class="tablewrap"><table><tr><th>التاريخ</th><th>الصنف</th><th>النوع</th><th>الكمية</th></tr>'+a.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleDateString("ar-EG")+'</td><td>'+esc(x.items?.name_ar)+'</td><td>'+({receipt:"استلام",issue:"صرف",adjustment:"تسوية"}[x.movement_type]||x.movement_type)+'</td><td>'+x.quantity+'</td></tr>').join("")+'</table></div>'}
async function moves(){let r=await db.from("stock_movements").select("*,items(name_ar)").eq("branch_id",branchId).order("created_at",{ascending:false}).limit(100);$("moveRows").innerHTML=r.error?esc(r.error.message):r.data.length?tableMoves(r.data):"لا توجد حركات"}
function form(title,fields,save){let html='<section class="card"><div class="row"><h3>'+title+'</h3><button class="soft" onclick="render()">رجوع</button></div>'+fields+'<button id="save">حفظ</button><div id="formErr" class="error"></div></section>';$("main").innerHTML=html;$("save").onclick=async()=>{try{$("save").disabled=true;await save();await load();render()}catch(e){$("formErr").textContent=e.message;$("save").disabled=false}}}
function inp(label,id,extra=""){return '<div class="field"><label>'+label+'</label><input id="'+id+'" '+extra+'></div>'}
function addItem(){if(profile.role!=="owner_admin"){alert("إضافة الأصناف متاحة للمالك فقط");return}form("إضافة صنف",inp("اسم الصنف بالعربية","n","required")+inp("اسم الصنف بالإنجليزية","en","required")+inp("كود الصنف","code")+ '<div class="field"><label>التصنيف</label><select id="cat"><option value="">بدون تصنيف</option>'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name_ar)+'</option>').join("")+'</select></div>'+inp("وحدة القياس","unit"),async()=>{let r=await db.from("items").insert({name_ar:$("n").value,name_en:$("en").value,item_code:$("code").value||null,category_id:$("cat").value||null,unit_ar:$("unit").value||"قطعة",created_by:user.id,updated_by:user.id});if(r.error)throw r.error})}
function addMove(){form("تسجيل حركة",'<div class="field"><label>الصنف</label><select id="item">'+items.map(i=>'<option value="'+i.id+'">'+esc(i.name_ar)+'</option>').join("")+'</select></div><div class="field"><label>النوع</label><select id="type"><option value="receipt">استلام / إضافة</option><option value="issue">صرف</option><option value="adjustment">تسوية</option></select></div>'+inp("الكمية","qty",'type="number" min="0.01" step="0.01" required')+inp("ملاحظات","note"),async()=>{let r=await db.from("stock_movements").insert({branch_id:branchId,item_id:$("item").value,movement_type:$("type").value,quantity:Number($("qty").value),note:$("note").value||null,created_by:user.id});if(r.error)throw r.error})}
function addSession(){form("بدء جلسة جرد",inp("اسم الجلسة","title","required")+inp("تاريخ الجرد","date",'type="date" required'),async()=>{let r=await db.from("inventory_sessions").insert({branch_id:branchId,title:$("title").value,inventory_date:$("date").value,created_by:user.id});if(r.error)throw r.error})}
async function sessions(){let r=await db.from("inventory_sessions").select("*").eq("branch_id",branchId).order("created_at",{ascending:false});$("sessions").innerHTML=r.error?esc(r.error.message):r.data.length?'<div class="tablewrap"><table><tr><th>الجلسة</th><th>التاريخ</th><th>الحالة</th></tr>'+r.data.map(s=>'<tr><td>'+esc(s.title)+'</td><td>'+esc(s.inventory_date)+'</td><td>'+esc(s.status)+'</td></tr>').join("")+'</table></div>':"لا توجد جلسات بعد"}
init().catch(err);
</script></body></html>

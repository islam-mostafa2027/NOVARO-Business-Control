const reverseTranslations=Object.fromEntries(Object.entries(translations).map(([a,b])=>[b,a]));
let language=localStorage.getItem("novaro-language")||"ar";
function applyLanguage(){
 const dict=language==="en"?translations:reverseTranslations;
 document.documentElement.lang=language;document.documentElement.dir=language==="ar"?"rtl":"ltr";
 document.body.dir=document.documentElement.dir;
 const walk=n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue.trim();if(dict[v])n.nodeValue=n.nodeValue.replace(v,dict[v]);}
 else if(n.nodeType===Node.ELEMENT_NODE){if(n.placeholder&&dict[n.placeholder])n.placeholder=dict[n.placeholder];if(n.title&&dict[n.title])n.title=dict[n.title];for(const c of [...n.childNodes])walk(c)}};
 const obs=window.__novaroObserver;if(obs)obs.disconnect();walk(document.body);
 const a=document.getElementById("langToggle"),b=document.getElementById("langToggleApp");
 if(a)a.textContent=language==="ar"?"English":"العربية";
 if(b)b.textContent=language==="ar"?"English":"العربية";
 if(obs)obs.observe(document.body,{childList:true,subtree:true,characterData:true});
}
function setLanguage(next){language=next;localStorage.setItem("novaro-language",language);applyLanguage();if(user&&profile)render();}
document.addEventListener("click",e=>{if(e.target.id==="langToggle"||e.target.id==="langToggleApp")setLanguage(language==="ar"?"en":"ar")});
const languageObserver=new MutationObserver(()=>applyLanguage());
window.__novaroObserver=languageObserver;
languageObserver.observe(document.body,{childList:true,subtree:true,characterData:true});

async function load(){let q=db.from("branches").select("*").eq("is_active",true).order("name_ar");if(profile.role!=="owner_admin"){let m=await db.from("branch_members").select("branch_id").eq("user_id",user.id).eq("is_active",true);q=q.in("id",(m.data||[]).map(x=>x.branch_id))}let [b,i,c,m]=await Promise.all([q,db.from("items").select("*,categories(name_ar)").eq("is_active",true).order("name_ar"),db.from("categories").select("*").eq("is_active",true).order("sort_order"),db.from("stock_movements").select("branch_id,item_id,movement_type,quantity")]);if(b.error)throw b.error;if(i.error)throw i.error;if(c.error)throw c.error;if(m.error)throw m.error;branches=b.data||[];items=i.data||[];cats=c.data||[];balances={};for(const x of(m.data||[])){const k=x.branch_id+":"+x.item_id;const q=Number(x.quantity);balances[k]=(balances[k]||0)+(x.movement_type==="issue"?-q:q)}if(!branches.some(x=>x.id===branchId))branchId=branches[0]?.id}

if(page==="home")m.innerHTML='<section class="stats"><div class="card">إجمالي الأصناف<b>'+items.length+'</b></div><div class="card">الفروع المتاحة<b>'+branches.length+'</b></div><div class="card">المستخدم الحالي<b style="font-size:16px">'+esc(profile.role)+'</b></div></section><section class="card"><div class="row"><h3>حركات الفرع الأخيرة</h3>'+sel()+'</div><div id="latest" class="empty">تحميل...</div></section>';

if(page==="users"){usersPage().catch(e=>m.innerHTML=esc(e.message));return}

if($("branchSelect")){$("branchSelect").value=branchId;$("branchSelect").onchange=e=>{branchId=e.target.value;render()}}

function form(title,fields,save){let html='<section class="card"><div class="row"><h3>'+title+'</h3><button class="soft" onclick="render()">رجوع</button></div>'+fields+'<button id="save">حفظ</button><div id="formErr" class="error"></div></section>';$("main").innerHTML=html;$("save").onclick=async()=>{try{$("save").disabled=true;await save();await load();render()}catch(e){$("formErr").textContent=e.message;$("save").disabled=false}}}
function inp(label,id,extra=""){return '<div class="field"><label>'+label+'</label><input id="'+id+'" '+extra+'></div>'}
function itemForm(existing=null){if(profile.role!=="owner_admin"){alert("إضافة وتعديل الأصناف متاحان للمالك فقط");return}const i=existing||{};form(existing?"تعديل الصنف":"إضافة صنف",inp("اسم الصنف بالعربية","n","required")+inp("اسم الصنف بالإنجليزية","en","required")+inp("كود الصنف","code")+ '<div class="field"><label>التصنيف</label><select id="cat"><option value="">بدون تصنيف</option>'+cats.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join("")+'</select></div>'+inp("وحدة القياس بالعربية","unit")+inp("Unit in English","unitEn")+inp("حد التنبيه عند انخفاض المخزون","minStock",'type="number" min="0" step="0.01"')+(existing?"":inp("الكمية الافتتاحية","initialQty",'type="number" min="0" step="0.01" value="0"'))+'<div class="field"><label>صورة الصنف</label><input id="itemImage" type="file" accept="image/png,image/jpeg,image/webp"></div>'+(i.image_url?'<img src="'+esc(i.image_url)+'" style="max-width:120px;border-radius:10px">':""),async()=>{let imageUrl=i.image_url||null;const file=$("itemImage").files[0];if(file){if(file.size>5*1024*1024)throw Error("حجم الصورة يجب ألا يتجاوز 5 ميجابايت");const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";const path=(i.id||crypto.randomUUID())+"/"+Date.now()+"."+ext;const up=await db.storage.from("inventory-items").upload(path,file,{contentType:file.type,upsert:true});if(up.error)throw up.error;imageUrl=db.storage.from("inventory-items").getPublicUrl(path).data.publicUrl}const payload={name_ar:$("n").value.trim(),name_en:$("en").value.trim(),item_code:$("code").value.trim()||null,category_id:$("cat").value||null,unit_ar:$("unit").value.trim()||"قطعة",unit_en:$("unitEn").value.trim()||"Piece",min_stock:Number($("minStock").value||0),image_url:imageUrl,updated_by:user.id};let r;if(existing){r=await db.from("items").update(payload).eq("id",existing.id)}else{r=await db.from("items").insert({...payload,created_by:user.id}).select().single();if(!r.error&&Number($("initialQty").value||0)>0){const mv=await db.from("stock_movements").insert({branch_id:branchId,item_id:r.data.id,movement_type:"receipt",quantity:Number($("initialQty").value),note:"رصيد افتتاحي",created_by:user.id});if(mv.error)throw mv.error}}if(r.error)throw r.error}) ;$("n").value=i.name_ar||"";$("en").value=i.name_en||"";$("code").value=i.item_code||"";$("cat").value=i.category_id||"";$("unit").value=i.unit_ar||"قطعة";$("unitEn").value=i.unit_en||"Piece";$("minStock").value=i.min_stock||0}
function addItem(){itemForm()}
function addCategory(){if(profile.role!=="owner_admin")return alert("إضافة التصنيفات متاحة للمالك فقط");form("إضافة تصنيف",inp("اسم التصنيف","catName","required"),async()=>{const name=$("catName").value.trim();if(!name)throw Error("اكتب اسم التصنيف");const r=await db.from("categories").insert({name_ar:name,name_en:name,sort_order:cats.length+1,is_active:true,created_by:user.id});if(r.error)throw r.error})}
function editQty(id){const i=items.find(x=>x.id===id);if(!i)return;const current=Number(balances[branchId+":"+id]||0);form("تعديل الكمية الفعلية",'<p>'+esc(i.name_ar)+' — الكمية الحالية: <b>'+current+'</b></p>'+inp("الكمية الموجودة فعليًا","newQty",'type="number" min="0" step="1" required'),async()=>{const next=Number($("newQty").value);if(!Number.isFinite(next)||next<0)throw Error("أدخل كمية صحيحة");const diff=next-current;if(diff===0)return;const r=await db.from("stock_movements").insert({branch_id:branchId,item_id:id,movement_type:diff>0?"receipt":"issue",quantity:Math.abs(diff),note:"تعديل الكمية الفعلية",created_by:user.id});if(r.error)throw r.error});$("newQty").value=current}

function editItem(id){const i=items.find(x=>x.id===id);if(i)itemForm(i)}
async function deactivateItem(id){if(profile.role!=="owner_admin")return alert("غير مصرح");if(!confirm("هل تريد إيقاف هذا الصنف؟"))return;const r=await db.from("items").update({is_active:false,updated_by:user.id}).eq("id",id);if(r.error)return alert(r.error.message);await load();render()}
async function saveUserRole(id){const role=$("role_"+id).value;const a=await db.from("profiles").update({role,updated_at:new Date().toISOString()}).eq("id",id);if(a.error)throw a.error;const b=await db.from("branch_members").update({branch_role:role}).eq("user_id",id);if(b.error)throw b.error;await usersPage()}
async function toggleUserActive(id,active){if(id===user.id)return alert("لا يمكن إيقاف حساب المالك الحالي");const r=await db.from("profiles").update({is_active:!active,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return alert(r.error.message);await usersPage()}
async function usersPage(){if(profile.role!=="owner_admin"){$("main").innerHTML='<section class="card empty">هذه الصفحة للمالك فقط</section>';return}const r=await db.from("profiles").select("id,display_name,role,is_active,created_at").order("created_at",{ascending:false});if(r.error)throw r.error;$("main").innerHTML='<section class="card"><h3>إضافة مستخدم جديد</h3><div class="formgrid">'+inp("اسم الموظف","uName","required")+inp("البريد الإلكتروني","uEmail",'type="email" required')+inp("كلمة مرور مؤقتة (8 أحرف على الأقل)","uPass",'type="password" minlength="8" required')+'</div><div class="field"><label>الصلاحية</label><select id="uRole"><option value="inventory_staff">موظف مخزون</option><option value="branch_manager">مدير فرع</option><option value="viewer">مشاهدة فقط</option></select></div><div class="field"><label>الفرع</label><select id="uBranch">'+branches.map(b=>'<option value="'+b.id+'">'+esc(b.name_ar)+'</option>').join("")+'</select></div><button id="createUser">إنشاء حساب الموظف</button><div id="userErr" class="error"></div></section><section class="card"><h3>المستخدمون والصلاحيات</h3><div class="tablewrap"><table><tr><th>الاسم</th><th>الصلاحية</th><th>الحالة</th><th>إجراء</th></tr>'+r.data.map(x=>'<tr><td>'+esc(x.display_name||"—")+'</td><td>'+(x.role==="owner_admin"?"مالك النظام":'<select id="role_'+x.id+'"><option value="inventory_staff" '+(x.role==="inventory_staff"?"selected":"")+'>موظف مخزون</option><option value="branch_manager" '+(x.role==="branch_manager"?"selected":"")+'>مدير فرع</option><option value="viewer" '+(x.role==="viewer"?"selected":"")+'>مشاهدة فقط</option></select>')+'</td><td>'+(x.is_active?"نشط":"موقوف")+'</td><td>'+(x.role==="owner_admin"?"—":'<button class="soft" onclick="saveUserRole(\''+x.id+'\')">حفظ الصلاحية</button> <button class="soft" onclick="toggleUserActive(\''+x.id+'\','+x.is_active+')">'+(x.is_active?"إيقاف":"تفعيل")+'</button>')+'</td></tr>').join("")+'</table></div></section>';$("createUser").onclick=async()=>{const b=$("createUser");b.disabled=true;$("userErr").textContent="";try{const result=await db.functions.invoke("admin-create-user",{body:{display_name:$("uName").value.trim(),email:$("uEmail").value.trim(),password:$("uPass").value,role:$("uRole").value,branch_id:$("uBranch").value}});if(result.error)throw result.error;if(result.data?.error)throw Error(result.data.error);alert("تم إنشاء حساب الموظف بنجاح");await usersPage()}catch(e){$("userErr").textContent=e.message||"تعذر إنشاء الحساب";b.disabled=false}}}
function addMove(){form("تسجيل حركة",'<div class="field"><label>الصنف</label><select id="item">'+items.map(i=>'<option value="'+i.id+'">'+esc(i.name_ar)+'</option>').join("")+'</select></div><div class="field"><label>النوع</label><select id="type"><option value="receipt">استلام / إضافة</option><option value="issue">صرف</option><option value="adjustment">تسوية</option></select></div>'+inp("الكمية","qty",'type="number" min="0.01" step="0.01" required')+inp("ملاحظات","note"),async()=>{let r=await db.from("stock_movements").insert({branch_id:branchId,item_id:$("item").value,movement_type:$("type").value,quantity:Number($("qty").value),note:$("note").value||null,created_by:user.id});if(r.error)throw r.error})}
function addSession(){form("بدء جلسة جرد",inp("اسم الجلسة","title","required")+inp("تاريخ الجرد","date",'type="date" required'),async()=>{let r=await db.from("inventory_sessions").insert({branch_id:branchId,title:$("title").value,inventory_date:$("date").value,created_by:user.id});if(r.error)throw r.error})}
async function sessions(){let r=await db.from("inventory_sessions").select("*").eq("branch_id",branchId).order("created_at",{ascending:false});$("sessions").innerHTML=r.error?esc(r.error.message):r.data.length?'<div class="tablewrap"><table><tr><th>الجلسة</th><th>التاريخ</th><th>الحالة</th></tr>'+r.data.map(s=>'<tr><td>'+esc(s.title)+'</td><td>'+esc(s.inventory_date)+'</td><td>'+esc(s.status)+'</td></tr>').join("")+'</table></div>':"لا توجد جلسات بعد"}
applyLanguage();init().catch(err);
</script></body></html>
